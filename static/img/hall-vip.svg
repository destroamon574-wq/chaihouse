<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="VIP-зал ЧайHouse с синими узорчатыми стенами и длинным столом">
  <title>VIP-зал ЧайHouse</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2b3b"/><stop offset="1" stop-color="#121d29"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2bd7a"/><stop offset=".55" stop-color="#c99a55"/><stop offset="1" stop-color="#9a6b33"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6a49"/><stop offset="1" stop-color="#513722"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#ffe4af" stop-opacity=".8"/><stop offset=".5" stop-color="#e2a24e" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e2a24e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="blue" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#16283a"/>
      <g fill="none" stroke="#c9a86a" stroke-width="2" opacity=".5">
        <path d="M75 10 L100 44 L136 75 L100 106 L75 140 L50 106 L14 75 L50 44 Z"/>
        <path d="M75 28 L120 75 L75 122 L30 75 Z"/>
        <path d="M0 75 H150 M75 0 V150"/>
      </g>
    </pattern>
    <pattern id="mosaic" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#1b2f44"/>
      <g fill="#c8563e"><circle cx="18" cy="18" r="7"/><circle cx="52" cy="52" r="7"/></g>
      <g fill="#2f8b82"><circle cx="52" cy="18" r="7"/><circle cx="18" cy="52" r="7"/></g>
      <g fill="#e6b45e"><circle cx="35" cy="35" r="6"/></g>
    </pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#wall)"/>

  <!-- wall pattern and panelling -->
  <rect x="0" y="90" width="1200" height="470" fill="url(#blue)"/>
  <rect x="0" y="90" width="1200" height="470" fill="#0d1823" opacity=".18"/>
  <path d="M0 80 H1200" stroke="#d9c7a4" stroke-width="16"/>
  <path d="M0 100 H1200" stroke="#a98c5b" stroke-width="3" opacity=".7"/>
  <rect x="0" y="560" width="1200" height="240" fill="#17232f"/>

  <!-- mirror -->
  <g transform="translate(600 275)">
    <circle cx="0" cy="0" r="118" fill="#0f1b25" stroke="#d7b46f" stroke-width="10"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#8f6b39" stroke-width="3"/>
    <g fill="none" stroke="#d7b46f" stroke-width="5" opacity=".7">
      <path d="M0 -92 L22 -38 L78 -58 L46 -8 L94 24 L38 26 L40 84 L0 44 L-40 84 L-38 26 L-94 24 L-46 -8 L-78 -58 L-22 -38 Z"/>
    </g>
    <circle cx="0" cy="0" r="148" fill="url(#warm)" opacity=".4"/>
  </g>

  <!-- pendant mosaic lamps -->
  <g>
    <g transform="translate(330 0)">
      <path d="M0 0 V92" stroke="#6a4c2d" stroke-width="4"/>
      <path d="M-40 150 q40 -92 80 0Z" fill="url(#mosaic)" filter="url(#shadow)"/>
      <path d="M-44 150 H44" stroke="#d7b46f" stroke-width="6"/>
      <circle cx="0" cy="152" r="84" fill="#ffe2a6" opacity=".18" filter="url(#soft)"/>
    </g>
    <g transform="translate(760 0) scale(.82)">
      <path d="M0 0 V120" stroke="#6a4c2d" stroke-width="4"/>
      <path d="M-40 150 q40 -92 80 0Z" fill="url(#mosaic)" filter="url(#shadow)"/>
      <path d="M-44 150 H44" stroke="#d7b46f" stroke-width="6"/>
      <circle cx="0" cy="152" r="84" fill="#ffe2a6" opacity=".17" filter="url(#soft)"/>
    </g>
    <g transform="translate(540 0) scale(.55)">
      <path d="M0 0 V180" stroke="#6a4c2d" stroke-width="5"/>
      <path d="M-46 170 q46 -104 92 0Z" fill="url(#mosaic)"/>
      <path d="M-50 170 H50" stroke="#d7b46f" stroke-width="7"/>
    </g>
  </g>

  <!-- banquette and art -->
  <g>
    <rect x="70" y="470" width="300" height="100" rx="20" fill="#8c6b48"/>
    <rect x="86" y="420" width="268" height="66" rx="18" fill="#9b7953"/>
    <g fill="#c9b18e" opacity=".5">
      <path d="M110 450 q20 -18 40 0" stroke="#5e432d" stroke-width="3" fill="none"/>
      <path d="M180 450 q20 -18 40 0" stroke="#5e432d" stroke-width="3" fill="none"/>
      <path d="M250 450 q20 -18 40 0" stroke="#5e432d" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(120 250)">
      <rect x="0" y="0" width="170" height="120" rx="4" fill="#d7c6ac"/>
      <path d="M10 90 q40 -70 75 -30 q40 -40 75 30" fill="none" stroke="#4c6a76" stroke-width="8" opacity=".65"/>
      <path d="M16 104 H154" stroke="#8f7859" stroke-width="3"/>
    </g>
  </g>

  <!-- long table perspective -->
  <g>
    <path d="M150 740 L1030 740 L890 560 L280 560 Z" fill="#000" opacity=".35" filter="url(#soft)"/>
    <path d="M160 725 L1020 725 L890 555 L290 555 Z" fill="url(#table)" filter="url(#shadow)"/>
    <path d="M160 725 L1020 725 L1010 705 L170 705 Z" fill="#e8c786"/>
    <g>
      <path d="M235 690 L960 690 L920 575 L300 575 Z" fill="#7c4c2b" opacity=".65"/>
      <path d="M245 686 L950 686 L915 580 L310 580 Z" fill="#3d2a1d"/>
    </g>
    <!-- place settings -->
    <g fill="#f4ead9">
      <ellipse cx="330" cy="620" rx="48" ry="17"/><ellipse cx="470" cy="608" rx="48" ry="17"/>
      <ellipse cx="610" cy="600" rx="48" ry="17"/><ellipse cx="750" cy="608" rx="48" ry="17"/>
      <ellipse cx="890" cy="620" rx="48" ry="17"/>
    </g>
    <g fill="#bc3f32">
      <rect x="300" y="600" width="62" height="34" rx="4" transform="rotate(6 331 617)"/>
      <rect x="440" y="588" width="62" height="34" rx="4" transform="rotate(-5 471 605)"/>
      <rect x="580" y="580" width="62" height="34" rx="4" transform="rotate(4 611 597)"/>
      <rect x="720" y="588" width="62" height="34" rx="4" transform="rotate(-4 751 605)"/>
      <rect x="860" y="603" width="62" height="34" rx="4" transform="rotate(5 891 620)"/>
    </g>
    <g fill="#e8cdb0">
      <circle cx="415" cy="655" r="17"/><circle cx="555" cy="645" r="17"/><circle cx="695" cy="645" r="17"/>
      <circle cx="835" cy="655" r="17"/>
    </g>
    <g stroke="#d7c39f" stroke-width="4" opacity=".85">
      <path d="M302 630 l-20 20 M330 638 l-14 18 M458 618 l-16 20 M486 626 l-12 18"/>
      <path d="M598 610 l-14 20 M626 618 l-10 18 M738 618 l-14 20 M766 626 l-10 18"/>
      <path d="M878 630 l-18 20 M906 638 l-12 18"/>
    </g>
    <g>
      <rect x="380" y="620" width="34" height="52" rx="5" fill="#f6eddd"/>
      <rect x="522" y="610" width="34" height="52" rx="5" fill="#f6eddd"/>
      <rect x="662" y="608" width="34" height="52" rx="5" fill="#f6eddd"/>
      <rect x="802" y="618" width="34" height="52" rx="5" fill="#f6eddd"/>
    </g>
    <g fill="#7a4b2c">
      <rect x="550" y="640" width="70" height="30" rx="8"/>
      <rect x="560" y="616" width="12" height="28"/>
      <rect x="598" y="616" width="12" height="28"/>
    </g>
  </g>

  <!-- chairs -->
  <g filter="url(#shadow)">
    <g transform="translate(230 560)">
      <rect x="0" y="0" width="92" height="160" rx="42" fill="#a82f2f"/>
      <rect x="10" y="12" width="72" height="110" rx="34" fill="#c4453d"/>
      <path d="M10 40 q36 -18 72 0" stroke="#e08b72" stroke-width="4" fill="none" opacity=".6"/>
      <rect x="16" y="158" width="10" height="58" fill="#3a2318"/><rect x="66" y="158" width="10" height="58" fill="#3a2318"/>
    </g>
    <g transform="translate(360 585) scale(.95)">
      <rect x="0" y="0" width="88" height="150" rx="40" fill="#1f6b4d"/>
      <rect x="10" y="12" width="68" height="104" rx="32" fill="#2c855e"/>
      <path d="M10 38 q34 -16 68 0" stroke="#79b794" stroke-width="4" fill="none" opacity=".55"/>
      <rect x="16" y="148" width="10" height="54" fill="#3a2318"/><rect x="62" y="148" width="10" height="54" fill="#3a2318"/>
    </g>
    <g transform="translate(490 600) scale(.9)">
      <rect x="0" y="0" width="86" height="140" rx="38" fill="#a82f2f"/>
      <rect x="10" y="10" width="66" height="98" rx="30" fill="#c4453d"/>
      <rect x="16" y="138" width="10" height="50" fill="#3a2318"/><rect x="60" y="138" width="10" height="50" fill="#3a2318"/>
    </g>
    <g transform="translate(690 585) scale(.95)">
      <rect x="0" y="0" width="88" height="150" rx="40" fill="#1f6b4d"/>
      <rect x="10" y="12" width="68" height="104" rx="32" fill="#2c855e"/>
      <path d="M10 38 q34 -16 68 0" stroke="#79b794" stroke-width="4" fill="none" opacity=".55"/>
      <rect x="16" y="148" width="10" height="54" fill="#3a2318"/><rect x="62" y="148" width="10" height="54" fill="#3a2318"/>
    </g>
    <g transform="translate(830 560)">
      <rect x="0" y="0" width="92" height="160" rx="42" fill="#a82f2f"/>
      <rect x="10" y="12" width="72" height="110" rx="34" fill="#c4453d"/>
      <path d="M10 40 q36 -18 72 0" stroke="#e08b72" stroke-width="4" fill="none" opacity=".6"/>
      <rect x="16" y="158" width="10" height="58" fill="#3a2318"/><rect x="66" y="158" width="10" height="58" fill="#3a2318"/>
    </g>
  </g>

  <path d="M0 770 H1200 V800 H0Z" fill="url(#floor)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".55"/>
</svg>
