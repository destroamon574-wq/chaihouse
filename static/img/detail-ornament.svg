<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Геометрический латунный узор на потолке чайханы">
  <title>Узор на потолке</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15100c"/><stop offset="1" stop-color="#080605"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c5f2a"/><stop offset=".5" stop-color="#e6bd76"/><stop offset="1" stop-color="#9c6a2f"/>
    </linearGradient>
    <radialGradient id="light" cx=".4" cy=".35" r=".6">
      <stop offset="0" stop-color="#ffe6b5" stop-opacity=".35"/><stop offset="1" stop-color="#ffe6b5" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#light)"/>
  <g transform="translate(400 300)">
    <g fill="none" stroke="url(#gold)" stroke-width="10">
      <path d="M0 -250 L110 -160 L250 -250 L160 -110 L250 0 L110 110 L250 250 L110 160 L0 250 L-110 160 L-250 250 L-160 110 L-250 0 L-160 -110 L-250 -250 L-110 -160 Z"/>
      <path d="M0 -160 L80 -110 L160 -160 L110 -80 L160 0 L80 80 L160 160 L80 110 L0 160 L-80 110 L-160 160 L-110 80 L-160 0 L-110 -80 L-160 -160 L-80 -110 Z"/>
      <circle cx="0" cy="0" r="72"/>
      <circle cx="0" cy="0" r="26"/>
    </g>
    <g fill="none" stroke="#c99a52" stroke-width="3" opacity=".6">
      <path d="M0 -420 V-260 M0 260 V420 M-420 0 H-260 M260 0 H420"/>
      <path d="M-300 -300 L-210 -210 M300 -300 L210 -210 M-300 300 L-210 210 M300 300 L210 210"/>
    </g>
    <g fill="#e9c47f" opacity=".85">
      <circle cx="0" cy="-250" r="8"/><circle cx="0" cy="250" r="8"/><circle cx="-250" cy="0" r="8"/>
      <circle cx="250" cy="0" r="8"/><circle cx="0" cy="0" r="8"/>
    </g>
  </g>
  <rect width="800" height="600" fill="#000" opacity=".15"/>
  <rect width="800" height="600" filter="url(#grain)" opacity=".6"/>
</svg>
