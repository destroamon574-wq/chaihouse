<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Латунный абажур с бахромой крупным планом">
  <title>Латунный свет</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17100c"/><stop offset="1" stop-color="#090605"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e3f26"/><stop offset=".35" stop-color="#b9813d"/>
      <stop offset=".7" stop-color="#e8b363"/><stop offset="1" stop-color="#8e5724"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe4af" stop-opacity=".95"/><stop offset=".4" stop-color="#e8a94e" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e8a94e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="#e9b868" opacity=".18">
    <circle cx="120" cy="180" r="24"/><circle cx="200" cy="420" r="14"/><circle cx="660" cy="160" r="30"/>
    <circle cx="710" cy="360" r="18"/><circle cx="580" cy="500" r="12"/><circle cx="90" cy="500" r="20"/>
  </g>
  <g transform="translate(400 300)">
    <circle cx="0" cy="20" r="300" fill="url(#glow)" opacity=".55"/>
    <path d="M0 -360 V-150" stroke="#4a3323" stroke-width="8"/>
    <path d="M-250 80 q250 -330 500 0Z" fill="url(#shade)" filter="url(#shadow)"/>
    <path d="M-258 80 H258" stroke="#f0c37a" stroke-width="12"/>
    <g stroke="#f0c37a" stroke-width="6" opacity=".9">
      <path d="M-244 86 V180"/><path d="M-214 86 V192"/><path d="M-184 86 V202"/><path d="M-154 86 V210"/>
      <path d="M-124 86 V216"/><path d="M-94 86 V220"/><path d="M-64 86 V224"/><path d="M-34 86 V226"/>
      <path d="M-4 86 V228"/><path d="M26 86 V226"/><path d="M56 86 V224"/><path d="M86 86 V220"/>
      <path d="M116 86 V216"/><path d="M146 86 V210"/><path d="M176 86 V202"/><path d="M206 86 V192"/><path d="M236 86 V180"/>
    </g>
    <g stroke="#a3692c" stroke-width="3" opacity=".8">
      <path d="M-240 90 V190"/><path d="M-200 90 V200"/><path d="M-160 90 V208"/><path d="M-120 90 V214"/>
      <path d="M-80 90 V220"/><path d="M-40 90 V224"/><path d="M0 90 V226"/><path d="M40 90 V224"/>
      <path d="M80 90 V220"/><path d="M120 90 V214"/><path d="M160 90 V208"/><path d="M200 90 V200"/>
    </g>
    <path d="M-210 20 q210 -140 420 0" fill="none" stroke="#fff0c9" stroke-width="5" opacity=".35"/>
    <circle cx="0" cy="120" r="120" fill="url(#glow)" opacity=".65"/>
  </g>
  <rect width="800" height="600" fill="#000" opacity=".12"/>
  <rect width="800" height="600" filter="url(#grain)" opacity=".6"/>
</svg>
