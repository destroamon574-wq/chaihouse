<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Основной зал ЧайHouse с бирюзовыми диванами и латунными лампами">
  <title>Основной зал ЧайHouse</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17100c"/><stop offset=".6" stop-color="#211610"/><stop offset="1" stop-color="#0d0907"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08121b"/><stop offset="1" stop-color="#16313a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#ffdca2" stop-opacity=".8"/><stop offset=".45" stop-color="#df9a45" stop-opacity=".25"/>
      <stop offset="1" stop-color="#df9a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx=".5" cy=".2" r=".8">
      <stop offset="0" stop-color="#ffe9c0"/><stop offset=".55" stop-color="#df9f4c"/><stop offset="1" stop-color="#84501f"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".75">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".68"/>
    </radialGradient>
    <pattern id="lat" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d2a35a" stroke-width="1.7" opacity=".5">
        <path d="M60 3 L86 34 L117 60 L86 86 L60 117 L34 86 L3 60 L34 34 Z"/>
        <path d="M60 16 L104 60 L60 104 L16 60 Z"/>
        <circle cx="60" cy="60" r="8"/>
      </g>
    </pattern>
    <pattern id="suz" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#1b5652"/>
      <g fill="none" stroke="#ddceb3" stroke-width="3" opacity=".55">
        <path d="M18 36 q28 -30 52 0 q-24 26 -52 0"/>
        <path d="M66 78 q26 -28 48 0 q-22 24 -48 0"/>
        <path d="M0 100 q18 -18 36 0 q-16 16 -36 0"/>
      </g>
    </pattern>
    <pattern id="red" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#6d2630"/>
      <g fill="none" stroke="#e3c9b0" stroke-width="2.3" opacity=".5">
        <path d="M14 24 q18 -18 36 0 q-16 16 -36 0"/>
        <path d="M52 62 q18 -18 36 0 q-16 16 -36 0"/>
      </g>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- ceiling -->
  <g>
    <path d="M0 0 H1200 L1120 130 L700 94 L340 118 L60 92 Z" fill="#120d0a"/>
    <g fill="url(#lat)" opacity=".55">
      <path d="M40 0 L260 0 L240 94 L62 82 Z"/>
      <path d="M300 0 L560 0 L548 92 L286 94 Z"/>
      <path d="M600 0 L860 0 L850 92 L590 92 Z"/>
      <path d="M900 0 L1130 0 L1150 96 L890 92 Z"/>
    </g>
  </g>

  <!-- windows & curtains -->
  <g>
    <rect x="40" y="150" width="430" height="300" fill="url(#night)"/>
    <g fill="#f0c47f" opacity=".5">
      <circle cx="90" cy="250" r="2.5"/><circle cx="150" cy="300" r="2"/><circle cx="220" cy="220" r="2"/>
      <circle cx="280" cy="330" r="2.5"/><circle cx="350" cy="270" r="2"/><circle cx="420" cy="350" r="2"/>
    </g>
    <g fill="#0a161d" opacity=".85">
      <rect x="50" y="300" width="80" height="150"/><rect x="160" y="260" width="60" height="190"/>
      <rect x="250" y="330" width="90" height="120"/><rect x="370" y="290" width="70" height="160"/>
    </g>
    <rect x="40" y="150" width="430" height="300" fill="none" stroke="#3a2b1f" stroke-width="14"/>
    <path d="M62 110 q42 160 12 355 l-50 0 0 -355Z" fill="#c7b18e" opacity=".82"/>
    <path d="M440 110 q-38 170 -10 355 l58 0 0 -355Z" fill="#cbb692" opacity=".82"/>
    <path d="M490 112 q44 160 16 350 l-56 0 0 -350Z" fill="#0c1c2a" opacity=".9"/>
  </g>

  <!-- bar -->
  <g>
    <rect x="820" y="200" width="380" height="280" fill="#160f0b"/>
    <rect x="820" y="200" width="380" height="24" fill="#3d2a1b"/>
    <g fill="#241810" stroke="#916a37" stroke-width="1.5">
      <rect x="850" y="250" width="90" height="130"/><rect x="960" y="250" width="90" height="130"/>
      <rect x="1070" y="250" width="100" height="130"/>
    </g>
    <g fill="#d7a34c" opacity=".55">
      <circle cx="895" cy="300" r="13"/><circle cx="1005" cy="300" r="13"/><circle cx="1120" cy="300" r="13"/>
    </g>
    <rect x="840" y="400" width="340" height="12" fill="#46301f"/>
    <rect x="850" y="412" width="10" height="68" fill="#2d1d13"/>
    <rect x="1160" y="412" width="10" height="68" fill="#2d1d13"/>
    <g transform="translate(1040 155)">
      <circle cx="0" cy="0" r="40" fill="#1d120d" stroke="#e05b2a" stroke-width="5"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#f0b35f" stroke-width="1.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f8e6cb" letter-spacing="1">ЧАЙHOUSE</text>
      <text x="0" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#e2a25f" letter-spacing="3">ЧАЙХАНА</text>
    </g>
  </g>

  <!-- lamps -->
  <g>
    <g transform="translate(280 0) scale(.9)">
      <path d="M0 0 V110" stroke="#4a3524" stroke-width="4"/>
      <path d="M-95 180 q95 -110 190 0Z" fill="url(#shade)" filter="url(#shadow)"/>
      <path d="M-99 180 H99" stroke="#e5b66c" stroke-width="6"/>
      <g stroke="#d9a24c" stroke-width="2" opacity=".8">
        <path d="M-92 184 V222"/><path d="M-70 184 V228"/><path d="M-48 184 V232"/><path d="M-26 184 V234"/>
        <path d="M0 184 V236"/><path d="M26 184 V234"/><path d="M48 184 V232"/><path d="M70 184 V228"/><path d="M92 184 V222"/>
      </g>
      <circle cx="0" cy="184" r="160" fill="url(#glow)" opacity=".6"/>
    </g>
    <g transform="translate(600 0) scale(.72)">
      <path d="M0 0 V150" stroke="#4a3524" stroke-width="4"/>
      <path d="M-95 220 q95 -110 190 0Z" fill="url(#shade)"/>
      <path d="M-99 220 H99" stroke="#e5b66c" stroke-width="7"/>
      <circle cx="0" cy="222" r="150" fill="url(#glow)" opacity=".5"/>
    </g>
    <g transform="translate(900 0) scale(.6)">
      <path d="M0 0 V170" stroke="#4a3524" stroke-width="4"/>
      <path d="M-90 250 q90 -104 180 0Z" fill="url(#shade)"/>
      <path d="M-94 250 H94" stroke="#e5b66c" stroke-width="8"/>
      <circle cx="0" cy="252" r="150" fill="url(#glow)" opacity=".45"/>
    </g>
  </g>

  <!-- seating rows -->
  <g filter="url(#shadow)">
    <g transform="translate(60 475)">
      <rect x="0" y="0" width="300" height="128" rx="26" fill="url(#suz)"/>
      <rect x="14" y="-58" width="272" height="80" rx="22" fill="url(#suz)"/>
      <rect x="24" y="-36" width="58" height="48" rx="10" fill="#6e2932"/>
      <rect x="220" y="-38" width="58" height="48" rx="10" fill="#d8c6aa"/>
    </g>
    <g transform="translate(420 500)">
      <rect x="0" y="0" width="300" height="124" rx="24" fill="#c8b18d"/>
      <rect x="14" y="-56" width="272" height="78" rx="22" fill="#d7c3a3"/>
      <rect x="26" y="-34" width="56" height="46" rx="10" fill="url(#red)"/>
      <rect x="218" y="-34" width="56" height="46" rx="10" fill="url(#suz)"/>
    </g>
    <g transform="translate(790 490)">
      <rect x="0" y="0" width="310" height="130" rx="26" fill="url(#suz)"/>
      <rect x="14" y="-58" width="282" height="80" rx="22" fill="url(#suz)"/>
      <rect x="28" y="-36" width="60" height="48" rx="10" fill="#d8c6aa"/>
      <rect x="226" y="-36" width="60" height="48" rx="10" fill="url(#red)"/>
    </g>
  </g>

  <!-- tables -->
  <g>
    <g transform="translate(125 610)">
      <rect x="0" y="0" width="270" height="64" rx="10" fill="#6b482d"/>
      <rect x="18" y="8" width="90" height="46" rx="4" fill="#34241a"/>
      <rect x="122" y="8" width="90" height="46" rx="4" fill="#34241a"/>
      <rect x="34" y="64" width="14" height="70" fill="#25170f"/>
      <rect x="222" y="64" width="14" height="70" fill="#25170f"/>
    </g>
    <g transform="translate(475 628)">
      <rect x="0" y="0" width="270" height="62" rx="10" fill="#714c2f"/>
      <rect x="16" y="8" width="94" height="44" rx="4" fill="#34241a"/>
      <rect x="124" y="8" width="94" height="44" rx="4" fill="#34241a"/>
      <rect x="32" y="62" width="14" height="66" fill="#25170f"/>
      <rect x="224" y="62" width="14" height="66" fill="#25170f"/>
    </g>
    <g transform="translate(838 618)">
      <rect x="0" y="0" width="276" height="64" rx="10" fill="#6b482d"/>
      <rect x="18" y="8" width="96" height="46" rx="4" fill="#34241a"/>
      <rect x="128" y="8" width="96" height="46" rx="4" fill="#34241a"/>
      <rect x="36" y="64" width="14" height="70" fill="#25170f"/>
      <rect x="226" y="64" width="14" height="70" fill="#25170f"/>
    </g>
  </g>

  <!-- foreground table -->
  <g>
    <path d="M40 740 H1160 V800 H40Z" fill="#5a3a25"/>
    <path d="M40 740 H1160" stroke="#8c5e3b" stroke-width="5" opacity=".7"/>
    <g fill="#31221a">
      <rect x="110" y="752" width="170" height="42" rx="4"/>
      <rect x="310" y="752" width="170" height="42" rx="4"/>
      <rect x="510" y="752" width="170" height="42" rx="4"/>
      <rect x="710" y="752" width="170" height="42" rx="4"/>
      <rect x="910" y="752" width="170" height="42" rx="4"/>
    </g>
  </g>

  <rect width="1200" height="800" fill="url(#vig)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".6"/>
</svg>
