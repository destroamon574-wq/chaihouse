  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#422c1c"/>
      <stop offset=".55" stop-color="#2a1b12"/>
      <stop offset="1" stop-color="#180f09"/>
    </linearGradient>
    <radialGradient id="light" cx=".38" cy=".26" r=".75">
